name: Software Security Analysis CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # run every 6 hours
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  replace-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout teaching repo
      uses: actions/checkout@v3
      with:
        repository: 'SVF-tools/Software-Security-Analysis'
        path: 'teaching'

    - name: Checkout solutions repo
      uses: actions/checkout@v3
      with:
        repository: 'yuleisui/Software-Security-Analysis'
        path: 'solutions'
        token: ${{ secrets.TEACHING_CI }}

    - uses: actions/setup-node@v3
      with:
        node-version: 18

    # Setup for Ubuntu
    - name: ubuntu-setup
      run: |
        sudo apt-get update
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get update
        sudo apt-get install cmake gcc g++ nodejs doxygen graphviz lcov libncurses5-dev libtinfo6 libzstd-dev

    # Install SVF dependencies
    - name: env-setup
      run: |
        npm install svf-lib

    # set python version
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install wheel pybind11 notebook nbconvert nbclient ipykernel build z3-solver
        pip install pysvf

    - name: Replace assignments with solutions
      run: |
        set -e
        # ---------------------------------------------------------------------
        # Assignment 1 / 2 — single-file overlay (Assignment_$i.cpp / .py).
        # ---------------------------------------------------------------------
        for i in 1 2; do
          echo "Copying Assignment-$i..."
          cp "solutions/Assignment-$i/CPP/Assignment_$i.cpp"  "teaching/Assignment-$i/CPP/Assignment_$i.cpp"
          cp "solutions/Assignment-$i/Python/Assignment_$i.py" "teaching/Assignment-$i/Python/Assignment_$i.py"
        done

        # ---------------------------------------------------------------------
        # Assignment 3 — the harness now lives in separate
        # AEHelper / AEReporter files, the public Assignment_3.h diverges from
        # the solution copy (template inlines no-op {} defaults for the
        # optional hook virtuals; the solution defines real bodies in
        # Assignment_3.cpp, so the inline defaults would re-define), and the
        # full case corpus (Tests/cases/{public,hidden}/...) only lives in the
        # solutions repo.  Mirror the entire Assignment-3 tree from the
        # solutions repo so all of that lands together and the harness +
        # ctest registrations stay consistent with the solution they expect.
        # ---------------------------------------------------------------------
        echo "Mirroring Assignment-3 from solutions..."
        rm -rf teaching/Assignment-3
        cp -R solutions/Assignment-3 teaching/Assignment-3

        # ---------------------------------------------------------------------
        # Lab-Exercise 1 / 2 / 3 — single-file overlay.
        # ---------------------------------------------------------------------
        cp solutions/Lab-Exercise-1/CPP/GraphAlgorithm.cpp teaching/Lab-Exercise-1/CPP/GraphAlgorithm.cpp
        cp solutions/Lab-Exercise-2/CPP/Z3Examples.cpp     teaching/Lab-Exercise-2/CPP/Z3Examples.cpp
        cp solutions/Lab-Exercise-2/CPP/test.cpp           teaching/Lab-Exercise-2/CPP/test.cpp
        cp solutions/Lab-Exercise-3/CPP/AEMgr.cpp          teaching/Lab-Exercise-3/CPP/AEMgr.cpp


    - name: Build and Test
      working-directory: teaching
      run: |
        export SVF_DIR=$(npm root)/SVF
        export LLVM_DIR=$(npm root)/llvm-21.1.0.obj
        export Z3_DIR=$(npm root)/z3.obj
        echo "SVF_DIR="$SVF_DIR
        echo "LLVM_DIR="$LLVM_DIR
        echo "Z3_DIR="$Z3_DIR
        cmake .
        make
        ctest --output-on-failure
